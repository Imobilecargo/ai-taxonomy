  <style>

    #header{position:fixed;top:0;left:0;right:0;height:52px;background:rgba(8,9,13,0.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:14px;z-index:100}

    #header .badge{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);background:rgba(139,92,246,0.1);border:1px solid rgba(139,92,246,0.2);padding:2px 8px;border-radius:4px}
    #header .hint{font-size:12px;color:var(--text-dim);margin-left:auto}
    #header .hint kbd{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--surface);border:1px solid var(--border);padding:1px 5px;border-radius:3px;color:var(--text)}
    svg{display:block}
    .link-line{fill:none;stroke-linecap:round}
    a.node-link{cursor:pointer}
    a.node-link:hover circle{filter:brightness(1.5) drop-shadow(0 0 6px rgba(52,211,153,0.4))}
    a.node-link:hover text{fill:#a7f3d0 !important}
    #tooltip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;z-index:200;opacity:0;transition:opacity 0.15s;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
    #tooltip.visible{opacity:1}
    #tooltip .tt-name{font-weight:600;font-size:13px;color:#fff}
    #tooltip .tt-code{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);margin-top:2px}
    #tooltip .tt-type{font-family:'JetBrains Mono',monospace;font-size:9px;margin-top:6px;padding:2px 6px;border-radius:3px;display:inline-block;background:rgba(52,211,153,0.15);color:var(--link)}
    #tooltip .tt-hint{font-size:10px;color:var(--accent);margin-top:4px}
    #legend{position:fixed;bottom:20px;left:20px;background:rgba(17,19,26,0.92);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:12px;padding:14px 18px;z-index:100;max-height:50vh;overflow-y:auto}
    #legend .legend-title{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px}
    .legend-item{display:flex;align-items:center;gap:10px;margin-bottom:5px}
    .legend-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .legend-label{font-size:11px;color:#8a90a0}
    #stats{position:fixed;bottom:20px;right:20px;display:flex;gap:12px;z-index:100}
    .stat-card{background:rgba(17,19,26,0.92);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:10px;padding:10px 16px;text-align:center}
    .stat-card .stat-num{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:#fff}
    .stat-card .stat-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px}
    #search-box{position:fixed;top:64px;right:20px;z-index:100}
    #search-input{font-family:'DM Sans',sans-serif;font-size:13px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 14px 8px 34px;color:var(--text);width:260px;outline:none;transition:border-color 0.2s,box-shadow 0.2s}

    #search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
    #search-box .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim)}
    #controls{position:fixed;top:64px;right:296px;display:flex;gap:8px;z-index:100}
    .ctrl-btn{font-family:'DM Sans',sans-serif;font-size:11px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);cursor:pointer;transition:border-color 0.2s,background 0.2s}
    .ctrl-btn:hover{border-color:var(--accent);background:rgba(139,92,246,0.08)}
  </style>
</head>

const branchColors=["#8b5cf6","#3b82f6","#06b6d4","#10b981","#f59e0b","#ef4444","#ec4899","#6366f1"];
const root=d3.hierarchy(data);
const allNodes=root.descendants();
document.getElementById('stats').innerHTML='<div class="stat-card"><div class="stat-num">'+allNodes.length+'</div><div class="stat-label">Nodes</div></div><div class="stat-card"><div class="stat-num">'+allNodes.filter(d=>d.data.url).length+'</div><div class="stat-label">Linked</div></div><div class="stat-card"><div class="stat-num">8</div><div class="stat-label">Pillars</div></div>';
const legendEl=document.getElementById('legend');
legendEl.innerHTML='<div class="legend-title">Pillars</div>';
data.children.forEach((c,i)=>{const item=document.createElement('div');item.className='legend-item';item.innerHTML='<div class="legend-dot" style="background:'+branchColors[i]+'"></div><span class="legend-label">'+c.name.replace(/\n/g,' ')+'</span>';legendEl.appendChild(item)});

const W=window.innerWidth,H=window.innerHeight;
const svg=d3.select('#canvas').attr('width',W).attr('height',H);
const g=svg.append('g');

// KEY FIX: filter 'click' out of zoom so <a> tags work natively
const zoomBehavior=d3.zoom().scaleExtent([0.1,5]).filter(function(event){
  // Allow all zoom events EXCEPT clicks (let <a> handle those)
  return event.type !== 'dblclick' && !(event.type === 'mousedown' && event.detail > 0 === false);
}).on('zoom',e=>g.attr('transform',e.transform));
svg.call(zoomBehavior);

const treeLayout=d3.tree().size([H*2.8,W-400]).separation((a,b)=>(a.parent===b.parent?1:1.2));
root.descendants().forEach(d=>{if(d.depth===0)d._color='#a78bfa';else if(d.depth===1)d._color=branchColors[d.parent.children.indexOf(d)%branchColors.length];else d._color=d.parent._color});
treeLayout(root);
svg.call(zoomBehavior.transform,d3.zoomIdentity.translate(180,-H*0.7).scale(0.55));

// Links
g.selectAll('.link-line').data(root.links()).join('path').attr('class','link-line').attr('d',d3.linkHorizontal().x(d=>d.y).y(d=>d.x)).attr('stroke',d=>d.target._color).attr('stroke-opacity',0.2).attr('stroke-width',d=>Math.max(0.8,4.5-d.target.depth*1.1));

// KEY FIX: Use native SVG <a> elements instead of JS click handlers
const nodeG=g.selectAll('.node').data(root.descendants()).join(enter=>{
  return enter.each(function(d){
    const parent=d3.select(this.parentNode);
    let container;
    if(d.data.url){
      // Wrap in SVG <a> element — browser handles click natively
      container=parent.append('a')
        .attr('href',d.data.url)
        .attr('target','_blank')
        .attr('rel','noopener')
        .attr('class','node-link')
        .datum(d);
    } else {
      container=parent.append('g').datum(d);
    }
    container
      .attr('transform','translate('+d.y+','+d.x+')')
      .classed('node-group',true);
  });
});

// Since the join above doesn't work cleanly, let's do it manually
g.selectAll('.node-group').remove();
g.selectAll('a.node-link').remove();

root.descendants().forEach(d=>{
  let container;
  if(d.data.url){
    container=g.append('a')
      .attr('href',d.data.url)
      .attr('target','_blank')
      .attr('rel','noopener')
      .attr('class','node-link');
  } else {
    container=g.append('g');
  }
  container.attr('transform','translate('+d.y+','+d.x+')').datum(d);

  // Circle
  container.append('circle')
    .attr('r',d.depth===0?10:d.depth===1?6:d.depth===2?4.5:3)
    .attr('fill',d._color)
    .attr('stroke',d.depth===0?'#c4b5fd':'none')
    .attr('stroke-width',2)
    .style('filter',d.depth===0?'drop-shadow(0 0 8px rgba(139,92,246,0.6))':'none');

  // Labels
  const hasUrl=!!d.data.url;
  const dx=d.children?-10:10;
  const anchor=d.children?'end':'start';

  if(d.depth===0){
    d.data.name.split('\n').forEach((line,i)=>{
      container.append('text').attr('x',0).attr('y',-28+i*16).attr('text-anchor','middle').attr('font-size',14).attr('font-weight',700).attr('fill','#e9d5ff').text(line);
    });
  } else if(d.depth===1){
    const lines=d.data.name.split('\n');
    lines.forEach((line,i)=>{
      container.append('text').attr('dx',dx).attr('dy',lines.length>1?-6+i*15:4).attr('text-anchor',anchor).attr('font-size',11.5).attr('font-weight',600).attr('fill',hasUrl?'#34d399':'#d1d5db').attr('text-decoration',hasUrl?'underline':'none').style('text-decoration-color','rgba(52,211,153,0.3)').text(line);
    });
  } else if(d.depth===2){
    const lines=d.data.name.split('\n');
    lines.forEach((line,i)=>{
      container.append('text').attr('dx',dx).attr('dy',lines.length>1?-4+i*13:4).attr('text-anchor',anchor).attr('font-size',10.5).attr('font-weight',500).attr('fill',hasUrl?'#34d399':'#a1a7b5').attr('text-decoration',hasUrl?'underline':'none').style('text-decoration-color','rgba(52,211,153,0.3)').text(line);
    });
  } else {
    container.append('text').attr('dx',8).attr('dy',3.5).attr('text-anchor','start').attr('font-size',9.5).attr('font-weight',400).attr('fill',hasUrl?'#6ee7b7':'#7a7f8e').attr('text-decoration',hasUrl?'underline':'none').style('text-decoration-color','rgba(110,231,183,0.25)').text(d.data.name);
  }

  // Tooltip
  container.on('mouseenter',function(event){
    if(!d.data.url)return;
    const tt=document.getElementById('tooltip');
    tt.querySelector('.tt-name').textContent=d.data.name.replace(/\n/g,' ');
    tt.querySelector('.tt-code').textContent=d.data.id||'';
    tt.classList.add('visible');
    tt.style.left=(event.clientX+16)+'px';
    tt.style.top=(event.clientY-10)+'px';
  }).on('mousemove',function(event){
    const tt=document.getElementById('tooltip');
    tt.style.left=(event.clientX+16)+'px';
    tt.style.top=(event.clientY-10)+'px';
  }).on('mouseleave',function(){
    document.getElementById('tooltip').classList.remove('visible');
  });
});

// Search
document.getElementById('search-input').addEventListener('input',function(){
  const q=this.value.toLowerCase().trim();
  g.selectAll('a.node-link, g').each(function(){
    const el=d3.select(this);
    const d=el.datum();
    if(!d||!d.data)return;
    const name=(d.data.name+' '+(d.data.id||'')).toLowerCase();
    el.attr('opacity',!q||name.includes(q)?1:0.06);
  });
  g.selectAll('.link-line').attr('stroke-opacity',q?0.04:0.2);
});

document.getElementById('btn-fit').addEventListener('click',()=>{svg.transition().duration(600).call(zoomBehavior.transform,d3.zoomIdentity.translate(180,-H*0.7).scale(0.55))});
document.getElementById('btn-wide').addEventListener('click',()=>{svg.transition().duration(600).call(zoomBehavior.transform,d3.zoomIdentity.translate(180,-H*2).scale(0.35))});
window.addEventListener('resize',()=>{svg.attr('width',window.innerWidth).attr('height',window.innerHeight)});
</script>
</body>
</html>
